<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>PT Cards</title>
  <meta name="title" content="PT Cards">
  <meta name="description" content="فلش‌کارت‌های آموزشی Play Time A & B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PT Cards">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B111D;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loading-container {
      text-align: center;
      max-width: 500px;
      padding: 20px;
    }
    .brand-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
      color: #FFFFFF;
    }
    .brand-subtitle {
      font-size: 16px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 40px;
      /* 🟢 تنظیم جهت متن به صورت چپ‌چین برای توضیحات انگلیسی */
      direction: ltr;
      unicode-bidi: isolate;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 171, 64, 0.1);
      border-radius: 50%;
      border-top-color: #FFAB40;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    .loading-text {
      color: #64748B;
      font-size: 14px;
      letter-spacing: 1px;
      /* 🟢 اجبار به چپ‌چین بودن برای نوشته Loading */
      direction: ltr;
      display: block;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="loading-indicator" class="loading-container">
  <div class="brand-title">PT Cards</div>
  <div class="brand-subtitle">
    Interactive educational flashcards for kids.<br>
    Mastering English vocabulary through play and fun.
  </div>

  <div class="spinner"></div>
  <div class="loading-text">Loading application...</div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
  window.addEventListener('flutter-first-frame', function () {
    var indicator = document.getElementById('loading-indicator');
    if (indicator) {
      indicator.remove();
    }
  });
</script>

</body>
</html>
